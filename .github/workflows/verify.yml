name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify locked build, tests and safe CLI failures
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: PostgreSQL permissions and migration integration
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/test-db.ps1
      - name: Build and run isolated Linux container
        if: runner.os == 'Linux'
        run: |
          docker compose config --quiet
          docker build -t stockmon:ci .
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges stockmon:ci
